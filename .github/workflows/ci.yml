name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      java_version:
        description: 'Java version to build with'
        type: choice
        options: ['17', '21']
        default: '17'
      run_tests:
        description: 'Run the test job?'
        type: boolean
        default: true
      environment:
        description: 'Target environment label'
        type: choice
        options: [dev, staging]
        default: dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Building for ${{ inputs.environment || 'dev' }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version || '17' }}
          cache: maven
      - run: mvn -B -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  test:
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.run_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version || '17' }}
          cache: maven
      - run: mvn -B test
