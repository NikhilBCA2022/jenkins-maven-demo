name: Maven CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

      run_tests:
        description: "Run unit tests"
        required: true
        default: "true"
        type: boolean

      maven_goals:
        description: "Maven goals to execute"
        required: true
        default: "clean verify"
        type: string

  repository_dispatch:
    types:
      - maven-build

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Print build parameters
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "Environment: ${{ github.event.inputs.environment || 'default' }}"
          echo "Run tests: ${{ github.event.inputs.run_tests || 'true' }}"
          echo "Maven goals: ${{ github.event.inputs.maven_goals || 'clean verify' }}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: |
          if [ "${{ github.event.inputs.run_tests || 'true' }}" = "true" ]; then
            mvn ${{ github.event.inputs.maven_goals || 'clean verify' }}
          else
            mvn clean package -DskipTests
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
